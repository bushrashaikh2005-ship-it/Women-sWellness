<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>HerWellness</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    * {
      box-sizing: border-box;
      font-family: "Segoe UI", sans-serif;
    }

    body {
      margin: 0;
      height: 100vh;
      background: linear-gradient(135deg, #cdb4db, #ffc8dd);
      display: flex;
      justify-content: center;
      align-items: center;
      color: #fff;
      overflow: hidden;
    }

    .landing {
      text-align: center;
      max-width: 700px;
      padding: 20px;
    }

    /* Text animations */
    .title {
      font-size: 56px;
      font-weight: 700;
      margin-bottom: 15px;
      opacity: 0;
      animation: fadeUp 1.4s ease forwards;
    }

    .tagline {
      font-size: 18px;
      opacity: 0;
      animation: fadeUp 1.4s ease forwards;
      animation-delay: 0.6s;
    }

    .enter-btn {
      display: inline-block;
      margin-top: 35px;
      padding: 12px 30px;
      background: #fff;
      color: #8b5fbf;
      border-radius: 30px;
      text-decoration: none;
      font-weight: 600;
      opacity: 0;
      animation: fadeUp 1.4s ease forwards;
      animation-delay: 1.2s;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(25px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Mobile */
    @media (max-width: 600px) {
      .title {
        font-size: 42px;
      }

    
      .tagline {
        font-size: 16px;
      }
    }
  </style>
</head>

<body>

  <div class="landing">
    <h1 class="title">HerWellness</h1>
    <p class="tagline">
      A gentle space for hormonal, emotional, and mental well-being
    </p>
    <a href="home.html" class="enter-btn">Enter</a>
  </div>

</body>
</html>
