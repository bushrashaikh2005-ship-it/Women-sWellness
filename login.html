<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Login | Signup</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
 

  <style>
    * {
      box-sizing: border-box;
      font-family: "Segoe UI", sans-serif;
    }

    body {
      height: 100vh;
      background: linear-gradient(135deg, #f8cdda, #1d2b64);
    }

    .page-content {
      padding-top: 80px;
    }


    .card {
      background: #fff;
      width: 100%;
      max-width: 380px;
      padding: 35px;
      border-radius: 15px;
      box-shadow: 0 15px 30px rgba(0, 0, 0, 0.15);
    }

    .card h2 {
      text-align: center;
      margin-bottom: 8px;
    }

    .card p {
      text-align: center;
      font-size: 14px;
      color: #777;
      margin-bottom: 25px;
    }

    .input-group {
      margin-bottom: 16px;
    }

    label {
      font-size: 13px;
      color: #555;
      margin-bottom: 6px;
      display: block;
    }

    input {
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid #ccc;
      outline: none;
    }

    input:focus {
      border-color: #1d2b64;
      box-shadow: 0 0 0 2px rgba(29, 43, 100, 0.1);
    }

    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: #1d2b64;
      color: white;
      font-size: 15px;
      cursor: pointer;
      margin-top: 10px;
    }

    button:hover {
      background: #16204a;
    }

    .toggle-text {
      text-align: center;
      margin-top: 18px;
      font-size: 13px;
    }

    .toggle-text span {
      color: #1d2b64;
      cursor: pointer;
      font-weight: 600;
    }

    .error {
      color: red;
      text-align: center;
      font-size: 13px;
      margin-top: 10px;
      display: none;
    }

    .signup {
      display: none;
    }
  </style>
</head>

<body>

  <div class="card">

    <!-- LOGIN -->
    <div class="login">
      <h2>Welcome 💖</h2>
      <p>Login to your account</p>

      <div class="input-group">
        <label>Email</label>
        <input type="email" id="loginEmail">
      </div>

      <div class="input-group">
        <label>Password</label>
        <input type="password" id="loginPassword">
      </div>

      <button onclick="login()">Login</button>

      <div class="error" id="loginError">Please fill all fields</div>

      <div class="toggle-text">
        Don’t have an account?
        <span onclick="showSignup()">Sign up</span>
      </div>
    </div>

    <!-- SIGNUP -->
    <div class="signup">
      <h2>Create Account 🌸</h2>
      <p>Join us today</p>

      <div class="input-group">
        <label>Full Name</label>
        <input type="text" id="signupName">
      </div>

      <div class="input-group">
        <label>Email</label>
        <input type="email" id="signupEmail">
      </div>

      <div class="input-group">
        <label>Password</label>
        <input type="password" id="signupPassword">
      </div>

      <button onclick="signup()">Sign Up</button>

      <div class="error" id="signupError">Please fill all fields</div>

      <div class="toggle-text">
        Already have an account?
        <span onclick="showLogin()">Login</span>
      </div>
    </div>

  </div>

  <script>
    const loginBox = document.querySelector(".login");
    const signupBox = document.querySelector(".signup");

    function showSignup() {
      loginBox.style.display = "none";
      signupBox.style.display = "block";
    }

    function showLogin() {
      signupBox.style.display = "none";
      loginBox.style.display = "block";
    }

    function login() {
      const email = loginEmail.value.trim();
      const password = loginPassword.value.trim();

      if (!email || !password) {
        loginError.style.display = "block";
      } else {
        loginError.style.display = "none";
        alert("Login successful!");
      }
    }

    function signup() {
      const name = signupName.value.trim();
      const email = signupEmail.value.trim();
      const password = signupPassword.value.trim();

      if (!name || !email || !password) {
        signupError.style.display = "block";
      } else {
        signupError.style.display = "none";
        alert("Account created successfully!");
        showLogin();
      }
    }
  </script>

</body>

</html>
